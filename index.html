<style>
/* Layout: quiet index of 16:9 title-screen covers; each opens a detail page with meta strip and a screen gallery */
:root {
  --bg: #F3F4F2;
  --surface: #FFFFFF;
  --fg: #151715;
  --muted: #697068;
  --line: #DCE0D9;
  --accent: #2E55E6;
  --font-display: "Archivo", "IBM Plex Sans KR", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1110; --surface: #181B19; --fg: #ECEEE9; --muted: #8F968D; --line: #2A2F2B; --accent: #8199FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1110; --surface: #181B19; --fg: #ECEEE9; --muted: #8F968D; --line: #2A2F2B; --accent: #8199FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 80px;
}
@media (min-width: 720px) {
  .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
}

/* Header */
.top {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px;
  padding-bottom: 20px; border-bottom: 1px solid var(--line);
}
.brand { text-decoration: none; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.brand span, .contact { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.contact { user-select: all; text-transform: none; }

/* Index */
.intro { display: grid; gap: 16px; padding-block: 56px 40px; }
.intro h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 52px);
  line-height: 1.08; letter-spacing: -0.025em; margin: 0; max-width: 16ch; text-wrap: balance;
}
.intro p { margin: 0; color: var(--muted); max-width: 52ch; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

/* App icon shelf, Google Play style */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 160px)); gap: 36px 28px; }
.app { text-decoration: none; display: grid; gap: 12px; align-content: start; min-width: 0; }
.icon {
  aspect-ratio: 1; max-width: 100%; border-radius: 22%; overflow: hidden; background: var(--line);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 24px -12px rgba(0,0,0,.4);
  transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s;
}
.icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph-icon { display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: 0.02em; }
.app:hover .icon, .app:focus-visible .icon { transform: translateY(-4px); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 18px 32px -14px rgba(0,0,0,.5); }
.app:focus-visible { outline: none; }
.app:focus-visible .icon { outline: 2px solid var(--accent); outline-offset: 4px; }
.app-name { display: grid; gap: 2px; }
.app-name b { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.3; }
.app-name span { font-size: 12px; color: var(--muted); }
.app:hover b { color: var(--accent); }

/* Hover preview card for app icons (pointer devices only) */
.pv {
  position: fixed; z-index: 40; width: 340px; max-width: calc(100vw - 32px); padding: 10px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 24px 48px -20px rgba(0,0,0,.45);
  display: grid; gap: 8px; pointer-events: none;
  opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s;
}
.pv.on { opacity: 1; transform: none; }
.pv img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pv-cover { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--line); }
.pv-thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pv-thumbs div { aspect-ratio: 16 / 10; border-radius: 4px; overflow: hidden; background: var(--line); }
.pv-meta { display: grid; gap: 2px; padding: 4px 2px 2px; }
.pv-meta b { font-family: var(--font-display); font-size: 15px; }
.pv-meta span { font-size: 12px; color: var(--muted); }
.pv-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 10px; border-radius: 6px; }
.pv-strip img { aspect-ratio: 1080 / 2400; border-radius: 4px; }
.pv-empty { display: grid; place-items: center; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--bg); color: var(--muted); font-size: 13px; }
.pv-empty .icon { width: 72px; box-shadow: none; }
@media (hover: none) { .pv { display: none; } }
@media (prefers-reduced-motion: reduce) { .pv { transition: none; } }

/* Company sections, newest first */
.company + .company { margin-top: 64px; }
.co-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding-bottom: 12px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.co-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin: 0; }
.co-head span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .icon { transition: none; } }

/* Shots: real images or generated placeholders */
.shot { position: relative; overflow: hidden; border-radius: 6px; background: var(--line); max-width: 100%; aspect-ratio: 16 / 9; }
.shot.portrait { aspect-ratio: 9 / 16; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.shot.has-img { aspect-ratio: auto; background: transparent; }
.shot.has-img img { height: auto; }
.ph { position: absolute; inset: 0; color: #fff; display: grid; }
.ph-title { place-items: center; text-align: center; }
.ph-title .logo { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4.4cqw, 54px); letter-spacing: 0.04em; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
.ph-title .sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; opacity: .8; margin-top: 10px; }
.ph-title .tap { position: absolute; bottom: 9%; left: 0; right: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em; animation: blink 1.6s ease-in-out infinite; }
.shot { container-type: inline-size; }
.portrait .ph-title .logo { font-size: clamp(20px, 11cqw, 48px); }
@keyframes blink { 50% { opacity: .25; } }

.ph-ui { grid-template-rows: auto 1fr auto; gap: 6%; padding: 5%; }
.ph-ui .bar { display: flex; gap: 3%; }
.ph-ui .bar i { display: block; height: clamp(8px, 3cqw, 18px); border-radius: 99px; background: rgba(255,255,255,.22); flex: 1; }
.ph-ui .bar i:first-child { flex: 2.4; background: rgba(255,255,255,.4); }
.ph-ui .body { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 4%; align-content: start; }
.ph-ui .body i { display: block; aspect-ratio: 1; border-radius: 10%; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); }
.ph-ui .label {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: nowrap;
}

/* Detail */
.back { display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); text-decoration: none; margin-top: 32px; }
.back:hover { color: var(--accent); }
.d-head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 24px; padding-block: 28px 32px; }
.d-head .icon { width: clamp(64px, 12vw, 104px); }
.d-head > div:last-child { display: grid; gap: 6px; min-width: 0; }
@media (max-width: 480px) { .d-head { grid-template-columns: 1fr; gap: 16px; } }
.d-head h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 6vw, 68px); line-height: 1; letter-spacing: -0.03em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.d-head .ko { color: var(--muted); font-size: 15px; }
.meta { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 36px 0 0; }
.meta div { padding: 16px 16px 16px 0; min-width: 0; }
.meta div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.meta dt { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.meta dd { margin: 4px 0 0; font-weight: 500; }
@media (max-width: 640px) {
  .meta { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meta div:nth-child(3) { padding-left: 0; border-left: 0; }
  .meta div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px 48px; padding-block: 40px 56px; }
.overview h3, .gallery-head { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
.overview p { margin: 0; max-width: 62ch; }
@media (max-width: 720px) { .overview { grid-template-columns: 1fr; } }

.gallery-head { padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 28px; display: flex; justify-content: space-between; }
/* Mixed gallery: landscape screens take a full row, portrait screens sit three to a row (two on phones) */
.gallery { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 40px 20px; align-items: start; }
.gallery figure.landscape { grid-column: span 6; }
.gallery figure.portrait { grid-column: span 2; }
@media (max-width: 640px) { .gallery figure.portrait { grid-column: span 3; } }
.empty { margin: 0; color: var(--muted); }

/* Work sections: section > group > tiles; the lead tile of a group spans the full row */
.sec + .sec { margin-top: 88px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 14px; margin-bottom: 32px; border-bottom: 1px solid var(--fg); }
.sec-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -0.02em; margin: 0; }
.sec-head span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grp + .grp { margin-top: 56px; }
.grp-head { display: grid; gap: 4px; margin-bottom: 18px; }
.grp-head h3 { font-size: 17px; font-weight: 600; margin: 0; }
.grp-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.tiles { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 28px 16px; }
.tiles.lead > .tile:first-child { grid-column: 1 / -1; }
.tile { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tile button { display: block; width: 100%; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--line); cursor: zoom-in; }
.tile img { display: block; width: 100%; height: auto; object-fit: cover; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.tile button:hover img { transform: scale(1.025); }
.tile button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.tile figcaption { font-size: 13px; color: var(--muted); line-height: 1.4; }
.tiles.lead > .tile:first-child figcaption { font-size: 14px; }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; } }
@media (max-width: 480px) { .tiles[data-cols="2"] { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .tiles[data-cols="5"] { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Hero strip of phone screens for portrait games */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(8px, 1.6vw, 20px); padding: clamp(16px, 3.2vw, 44px); border-radius: 6px; }
.strip img { display: block; width: 100%; aspect-ratio: 1080 / 2400; object-fit: cover; border-radius: clamp(6px, 1vw, 12px); box-shadow: 0 16px 32px -14px rgba(0,0,0,.6); }
@media (max-width: 640px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } .strip img:nth-child(n+4) { display: none; } }
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } }

.lb-fig { margin: 0; display: grid; gap: 12px; justify-items: center; cursor: default; }
.lb-fig img { display: block; max-width: min(94vw, 1600px); max-height: 82vh; width: auto; height: auto; border-radius: 6px; }
.lb-fig figcaption { color: #ECEEE9; font-size: 14px; text-align: center; }
.lb-fig figcaption span { font-family: var(--font-mono); font-size: 12px; color: #8F968D; margin-left: 10px; font-variant-numeric: tabular-nums; }
.lb-nav {
  position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.14); color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
}
.lb-nav:hover { background: rgba(255,255,255,.26); }
.lb-prev { left: max(16px, env(safe-area-inset-left, 0px)); }
.lb-next { right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 720px) { .lb-nav { top: auto; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: none; } }
figure { margin: 0; display: grid; gap: 10px; min-width: 0; }
figure .shot { cursor: zoom-in; }
figcaption { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
figcaption b { font-weight: 600; }
figcaption span { color: var(--muted); font-size: 14px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 80px; border-top: 1px solid var(--line); padding-top: 24px; }
.pager a { text-decoration: none; display: grid; gap: 2px; }
.pager a:last-child { text-align: right; }
.pager small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.pager b { font-family: var(--font-display); font-size: clamp(16px, 2.4vw, 22px); }
.pager a:hover b { color: var(--accent); }

footer { margin-top: 80px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,8,.88); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lb .shot { width: min(94vw, calc(86vh * 16 / 9)); border-radius: 8px; }
.lb .shot.portrait { width: min(94vw, calc(86vh * 9 / 16)); }
.lb .shot.has-img { width: auto; }
.lb .shot.has-img img { width: auto; max-width: 94vw; max-height: 86vh; }
.lb .cap { color: #ECEEE9; font-size: 14px; margin-top: 12px; text-align: center; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) {
  .ph-title .tap { animation: none; }
  .card .shot { transition: none; }
}
</style>
</head>

<div class="lb" id="lb" hidden></div>

<script>

];
const byId = id => projects.find(p => p.id === id);
const ordered = companies.flatMap(c => c.ids.map(byId));
const companyOf = p => companies.find(c => c.ids.includes(p.id));

const app = document.getElementById("app");
const lb = document.getElementById("lb");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function shot(p, s, { orient = s.orient || p.orient, src, crop } = {}) {
  const cls = "shot" + (orient === "portrait" ? " portrait" : "") + (src && !crop ? " has-img" : "");
  if (src) return `<div class="${cls}"><img src="${esc(src)}" alt="${esc(p.title + " " + s.name)}" loading="lazy"></div>`;
  const [h1, h2] = p.hue;
  const bg = `background: linear-gradient(140deg, hsl(${h1} 55% 22%), hsl(${h2} 62% 44%));`;
  if (s.kind === "title") {
    return `<div class="${cls}" role="img" aria-label="${esc(p.title)} 타이틀 화면 자리"><div class="ph ph-title" style="${bg}">
      <div><div class="logo">${esc(p.title)}</div><div class="sub">${esc(p.genre)}</div></div>
      <div class="tap">TAP TO START</div></div></div>`;
  }
  const tiles = "<i></i>".repeat((s.cols || 4) * (orient === "portrait" ? 3 : 2));
  return `<div class="${cls}" role="img" aria-label="${esc(s.name)} 화면 자리"><div class="ph ph-ui" style="${bg}">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body" style="--cols:${s.cols || 4}">${tiles}</div>
    <div class="bar"><i></i><i></i><i></i><i></i></div>
    <span class="label">${esc(s.name)}</span></div></div>`;
}

const stripBg = p => `background: linear-gradient(140deg, hsl(${p.hue[0]} 40% 16%), hsl(${p.hue[1]} 45% 32%));`;

function icon(p) {
  if (p.icon) return `<div class="icon"><img src="${esc(p.icon)}" alt="${esc(p.title)} 앱 아이콘"></div>`;
  const [h1, h2] = p.hue;
  const initials = p.title.split(" ").map(w => w[0]).join("").slice(0, 2);
  return `<div class="icon ph-icon" role="img" aria-label="${esc(p.title)} 아이콘 자리" style="background: linear-gradient(140deg, hsl(${h1} 55% 24%), hsl(${h2} 62% 46%));">${esc(initials)}</div>`;
}

function renderIndex() {
  document.title = "Game UI Portfolio (Jeon Sang Cheol)";
  app.innerHTML = `
    <section class="intro">
      <span class="count">Projects ${String(projects.length).padStart(2, "0")}</span>
      <h1>플레이어가 먼저 이해하는 화면을 만듭니다</h1>
      <p>모바일 게임 UI 디자이너입니다. 아이콘을 누르면 프로젝트별 화면 설계를 볼 수 있습니다.</p>
    </section>
    ${companies.map(c => `
      <section class="company">
        <header class="co-head"><h2>${esc(c.name)}</h2><span>${esc(c.period)}</span></header>
        <div class="apps">
          ${c.ids.map(byId).map(p => `
            <a class="app" href="#${p.id}">
              ${icon(p)}
              <div class="app-name"><b>${esc(p.title)}</b><span>${esc(p.genre)}</span></div>
            </a>`).join("")}
        </div>
      </section>`).join("")}`;
  if (matchMedia("(hover: hover)").matches) {
    app.querySelectorAll(".app").forEach(a => {
      const p = byId(a.getAttribute("href").slice(1));
      a.addEventListener("mouseenter", () => showPreview(p, a));
      a.addEventListener("focus", () => showPreview(p, a));
      a.addEventListener("mouseleave", hidePreview);
      a.addEventListener("blur", hidePreview);
    });
  }
}

// Preview: cover + the first piece of each work section
const pv = document.createElement("div");
pv.className = "pv";
pv.setAttribute("aria-hidden", "true");
document.body.append(pv);
let pvTimer;

function showPreview(p, anchor) {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => {
    const co = companyOf(p);
    const picks = p.strip ? [] : (p.sections || []).map(s => s.groups[0].items[0]).slice(0, 3);
    pv.innerHTML = (p.strip
      ? `<div class="pv-strip" style="${stripBg(p)}">${p.strip.map(f => `<img src="${esc(p.dir + f + "-t.jpg")}" alt="">`).join("")}</div>`
      : p.cover
      ? `<div class="pv-cover"><img src="${esc(p.cover)}" alt=""></div>`
      : `<div class="pv-empty">${icon(p)}<span>상세 화면 준비 중</span></div>`) +
      (picks.length ? `<div class="pv-thumbs">${picks.map(it => `<div><img src="${esc(p.dir + it.f + "-t.jpg")}" alt=""></div>`).join("")}</div>` : "") +
      `<div class="pv-meta"><b>${esc(p.title)}</b><span>${esc(p.genre)}${co ? ` · ${esc(co.name)}` : ""}</span>${p.role && !/입력/.test(p.role) ? `<span>${esc(p.role)}</span>` : ""}</div>`;
    const r = anchor.querySelector(".icon").getBoundingClientRect();
    const w = pv.offsetWidth, h = pv.offsetHeight, gap = 16;
    let x = r.right + gap;
    if (x + w > innerWidth - 16) x = r.left - gap - w;
    x = Math.max(16, x);
    const y = Math.min(Math.max(16, r.top + r.height / 2 - h / 2), innerHeight - h - 16);
    pv.style.left = x + "px";
    pv.style.top = y + "px";
    pv.classList.add("on");
  }, 120);
}

function hidePreview() {
  clearTimeout(pvTimer);
  pv.classList.remove("on");
}

function renderDetail(p) {
  document.title = p.title + " · Game UI Portfolio";
  const i = ordered.indexOf(p);
  const prev = ordered[(i - 1 + ordered.length) % ordered.length];
  const next = ordered[(i + 1) % ordered.length];
  const co = companyOf(p);
  const sub = [p.ko, co && `${co.name} · ${co.period}`].filter(Boolean).join(" · ");
  app.innerHTML = `
    <a class="back" href="#">← 전체 프로젝트</a>
    <section class="d-head">
      ${icon(p)}
      <div>
        <h1>${esc(p.title)}</h1>
        ${sub ? `<span class="ko">${esc(sub)}</span>` : ""}
      </div>
    </section>
    ${p.strip
      ? `<div class="strip" style="${stripBg(p)}">${p.strip.map(f => `<img src="${esc(p.dir + f + "-t.jpg")}" alt="${esc(p.title)} 화면">`).join("")}</div>`
      : shot(p, { kind: "title", name: "타이틀" }, { orient: "landscape", src: p.cover, crop: true })}
    <dl class="meta">
      ${[["Genre", p.genre], ["Role", p.role], ["Year", p.year], ["Tools", p.tools]].filter(([, v]) => v)
        .map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}
    </dl>
    <section class="overview">
      <h3>Overview</h3>
      <p>${esc(p.summary)}</p>
    </section>
    ${p.sections ? renderSections(p) : renderScreens(p)}
    <nav class="pager">
      <a href="#${prev.id}"><small>이전 프로젝트</small><b>${esc(prev.title)}</b></a>
      <a href="#${next.id}"><small>다음 프로젝트</small><b>${esc(next.title)}</b></a>
    </nav>`;
  app.querySelectorAll(".tile button").forEach(b => b.addEventListener("click", () => openLightbox(+b.dataset.i)));
  app.querySelectorAll("figure:not(.tile)").forEach(f => {
    f.querySelector(".shot").addEventListener("click", () => {
      const s = p.screens[+f.dataset.n];
      lbItems = [];
      lb.innerHTML = `<div>${shot(p, s, { src: s.src })}<div class="cap">${esc(s.name)}</div></div>`;
      lb.hidden = false;
    });
  });
}

// Grouped work sections; fills lbItems in display order for the lightbox
function renderSections(p) {
  lbItems = [];
  return p.sections.map(sec => {
    const count = sec.groups.reduce((n, g) => n + g.items.length, 0);
    return `<section class="sec">
      <div class="sec-head"><h2>${esc(sec.title)}</h2><span>${count}</span></div>
      ${sec.groups.map(g => `
        <div class="grp">
          <div class="grp-head"><h3>${esc(g.title)}</h3>${g.note ? `<p>${esc(g.note)}</p>` : ""}</div>
          <div class="tiles${g.lead ? " lead" : ""}" data-cols="${g.cols}" style="--cols:${g.cols}">
            ${g.items.map((it, k) => {
              const i = lbItems.push({ src: p.dir + it.f + ".jpg", name: it.name, group: g.title }) - 1;
              const src = p.dir + it.f + (g.lead && k === 0 ? ".jpg" : "-t.jpg");
              return `<figure class="tile">
                <button type="button" data-i="${i}" aria-label="${esc(it.name)} 크게 보기"><img src="${src}" alt="${esc(g.title + " " + it.name)}" loading="lazy" style="aspect-ratio:${g.ratio}"></button>
                <figcaption>${esc(it.name)}</figcaption>
              </figure>`;
            }).join("")}
          </div>
        </div>`).join("")}
    </section>`;
  }).join("");
}

let lbItems = [], lbIndex = 0;
function openLightbox(i) {
  lbIndex = (i + lbItems.length) % lbItems.length;
  const it = lbItems[lbIndex];
  lb.innerHTML = `
    <button type="button" class="lb-nav lb-prev" aria-label="이전 이미지">‹</button>
    <figure class="lb-fig"><img src="${esc(it.src)}" alt="${esc(it.group + " " + it.name)}">
      <figcaption>${esc(it.group)} · ${esc(it.name)}<span>${lbIndex + 1} / ${lbItems.length}</span></figcaption></figure>
    <button type="button" class="lb-nav lb-next" aria-label="다음 이미지">›</button>`;
  lb.hidden = false;
}

function renderScreens(p) {
  return `
    <div class="gallery-head"><span>Screens</span><span>${p.screens.length}</span></div>
    ${p.screens.length ? "" : `<p class="empty">화면 이미지를 준비하고 있습니다.</p>`}
    <section class="gallery">
      ${p.screens.map((s, n) => `
        <figure class="${s.orient || p.orient}" data-n="${n}">
          ${shot(p, s, { src: s.src })}
          <figcaption><b>${esc(s.name)}</b>${s.note ? `<span>${esc(s.note)}</span>` : ""}</figcaption>
        </figure>`).join("")}
    </section>`;
}

function route() {
  const id = location.hash.slice(1);
  const p = projects.find(x => x.id === id);
  lb.hidden = true;
  hidePreview();
  p ? renderDetail(p) : renderIndex();
  window.scrollTo(0, 0);
}

lb.addEventListener("click", e => {
  const nav = e.target.closest(".lb-nav");
  if (nav) openLightbox(lbIndex + (nav.classList.contains("lb-next") ? 1 : -1));
  else if (!e.target.closest(".lb-fig img")) lb.hidden = true;
});
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") lb.hidden = true;
  else if (lbItems.length && e.key === "ArrowRight") openLightbox(lbIndex + 1);
  else if (lbItems.length && e.key === "ArrowLeft") openLightbox(lbIndex - 1);
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
